model_path: meta-llama/Llama-3.1-8B-Instruct
default_batch_size: 8
learning_batch_size: 48
generate_batch_size: 24
eval_batch_size: 6
dtype: ${dtype:torch.float32}
# dtype: ${dtype:torch.bfloat16}
module_names: ${.default_module_names.res_17}


default_module_names:
  mlp_modules:
    - "model.layers.*.mlp.up_proj"
    - "model.layers.*.mlp.down_proj"
    - "model.layers.*.mlp.gate_proj"
  layernorm: ['.+layernorm']
  post_layernorm: [".*post_attention_layernorm", ".*post_feedforward_layernorm"]
  fast: ['model.layers.0.mlp.down_proj']
  res_15: ['model.layers.15']
  res_16: ['model.layers.16']
  res_17: ['model.layers.17']
  default: ${.post_layernorm}
